# CONFIG_ZTEST is set per scenario in testcase.yaml, not here: reflow.fatal.panic
# is a plain application, because ztest's fatal hook collides with fatal.c.

CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# The control core is not in this image; the optional features must stay out too,
# or their Kconfig dependencies pull in subsystems this test has no board for.
CONFIG_REFLOW_SHELL=n
CONFIG_REFLOW_UI_DISPLAY=n
CONFIG_REFLOW_UI_INPUT=n
CONFIG_REFLOW_NET=n

# The evidence that the cut happened is a log line, so the image needs the
# same logging the firmware ships with: CONFIG_LOG=y and the app at INF, as in
# the application prj.conf. Deferred mode is the default and is what the
# rpi_pico2 build uses, so LOG_PANIC() flushing from the fatal path is part of
# what this scenario measures rather than something configured away.
CONFIG_LOG=y
CONFIG_REFLOW_LOG_LEVEL_INF=y
