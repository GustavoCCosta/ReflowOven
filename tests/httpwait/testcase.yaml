tests:
  reflow.httpwait:
    platform_allow:
      - native_sim
      - qemu_x86
    tags:
      - reflow
      - net
      - httpd
      - funcional
    # The image waits on the compressed fake timeout twice and then on the
    # server's own poll cadence, so the suite is dominated by sleeping.
    timeout: 120

  # Same image, same assertions, at the top of the allowed client range
  # (RFO-B15). The server polls one listening socket plus MAX_CLIENTS
  # connections, so this is the configuration that needs the most poll entries -
  # and with CONFIG_ZVFS_POLL_MAX left at 8, zsock_poll() answered -EINVAL on
  # every call and the server never accepted anything. Nothing in the build said
  # so: it is a runtime failure of a legal configuration, which is why it needs
  # a scenario and not a comment.
  reflow.httpwait.max_clients:
    platform_allow:
      - native_sim
      - qemu_x86
    tags:
      - reflow
      - net
      - httpd
      - funcional
    extra_configs:
      - CONFIG_REFLOW_NET_MAX_CLIENTS=8
    timeout: 120

  # RFO-G35: the top of the client range on a link where the oven RUNS a DHCPv4
  # server, which is what REFLOW_LINK_USB_ECM and REFLOW_LINK_WIFI_AP do. That
  # server opens a BSD UDP socket, costing one net_context and one net_conn on
  # top of the listener and the clients - the term the first version of the
  # assertions in httpd.c did not carry.
  #
  # build_only, and honestly so: nothing here runs a DHCPv4 server or a real
  # link, and the suite has no bench for one. What this scenario adds is that
  # the arithmetic is checked in CI at the configuration that needs the most of
  # everything. The CI board matrix does build the USB link, but at the default
  # four clients, where the numbers are comfortable and a value lowered below
  # the requirement would still compile.
  #
  # It cannot catch a WEAK assertion - the shipped values satisfy both the old
  # and the new arithmetic - and that is not what it is for. The assertion's own
  # correctness is what the mutation in the PR proves.
  reflow.httpwait.dhcpv4_server:
    platform_allow:
      - native_sim
      - qemu_x86
    build_only: true
    tags:
      - reflow
      - net
      - httpd
      - configuracao
    extra_configs:
      - CONFIG_REFLOW_NET_MAX_CLIENTS=8
      - CONFIG_NET_DHCPV4_SERVER=y
