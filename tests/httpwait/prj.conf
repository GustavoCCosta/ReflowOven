CONFIG_ZTEST=y
CONFIG_ZBUS=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# The web UI is the subject here, so REFLOW_NET is on and brings its own
# networking dependencies through the application Kconfig. The display and the
# encoder are not in the image, for the reason tests/controller records.
CONFIG_REFLOW_NET=y
CONFIG_REFLOW_SHELL=n
CONFIG_REFLOW_UI_DISPLAY=n
CONFIG_REFLOW_UI_INPUT=n

# There is no radio and no USB host on a simulated platform: the only interface
# is the software loopback, which is enough to connect to the server the way a
# browser would. No link module is in the image either (see CMakeLists), so the
# Wi-Fi side of the Kconfig choice is inert here.
CONFIG_NET_LOOPBACK=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n

# A remote command needs a token or the endpoint answers 503 (RFO-B02). This
# suite only reads telemetry, but leaving the token empty would make the one
# 503 answer indistinguishable from a route that is not there.
CONFIG_REFLOW_NET_TOKEN="testtoken"

# Loopback only, and no host-side networking backend. Left at their defaults,
# NETWORKING on these platforms brings up a SLIP/TAP link to the host: qemu is
# started with `-serial unix:/tmp/slip.sock`, which on this machine means the
# image produces no output at all, and native_sim wants a tap device the CI
# runner does not have. Upstream does the same thing for its loopback-only
# runs (samples/net/zperf/overlay-loopback-icount.conf).
CONFIG_NET_QEMU_SLIP=n
CONFIG_NET_SLIP_TAP=n
CONFIG_ETH_NATIVE_TAP=n

# The loopback driver delivers each packet synchronously in the sender's
# context, so the receive path runs nested on the caller's stack. Same reason
# and same order of magnitude as the upstream overlay above.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_ZTEST_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=2560
CONFIG_NET_TX_STACK_SIZE=2560
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2560
