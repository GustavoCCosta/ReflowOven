CONFIG_ZTEST=y
CONFIG_ZBUS=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# The subject of this suite. DISPLAY and LVGL come in by `select` from the
# application Kconfig, not from here - that is the property the modularity
# matrix protects.
CONFIG_REFLOW_UI_DISPLAY=y

# The panel this suite needs is one whose readiness it can deny, not one that
# draws: the dummy driver gives a real device on a simulated platform.
CONFIG_DUMMY_DISPLAY=y

CONFIG_REFLOW_SHELL=n
CONFIG_REFLOW_UI_INPUT=n
CONFIG_REFLOW_NET=n

# Dimensionamento que o Kconfig da aplicacao ANUNCIA mas nao entrega, e por isso
# posto aqui a mao (RFO-B12, achado ao montar esta suite).
#
# `configdefault LV_Z_MEM_POOL_SIZE default 24576 if REFLOW_UI_DISPLAY` fica no
# bloco DEPOIS de `source "Kconfig.zephyr"` no Kconfig da aplicacao, e o upstream
# declara `default 2048` sem condicao (zephyr/modules/lvgl/Kconfig.memory:41).
# Entao o configdefault nunca se aplica e a imagem sai com 2048 - o mesmo defeito
# de POSICAO do RFO-B15 (#121) e do RFO-G32 (#122), agora na familia LV_Z_*.
# Com 2048 esta imagem nao chega nem a imprimir o banner.
#
# Corrigir aquilo NAO e este ticket - a #122 pos os configdefault que nao sao de
# rede fora de escopo, com a instrucao de comentar e nao emendar. Fixo os valores
# aqui para a suite ter uma imagem que roda, e digo no PR que a suite roda com
# dimensionamento que o firmware de hoje nao tem.
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_MAIN_STACK_SIZE=2048

# O qemu_x86 tem um no `qemu,ramfb` na devicetree, e habilitar DISPLAY liga o
# driver dele sozinho - que acrescenta `-device ramfb -vga none -display sdl` a
# linha do QEMU. O QEMU do Zephyr SDK no Windows nao tem SDL e se recusa a
# iniciar, sem imprimir uma linha: era por isso que o log vinha vazio e o
# twister estourava o timeout. Esta suite quer um device cuja prontidao ela possa
# negar, nao um framebuffer.
CONFIG_QEMU_RAMFB_DISPLAY=n
