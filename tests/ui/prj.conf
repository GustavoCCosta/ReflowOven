CONFIG_ZTEST=y
CONFIG_ZBUS=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# The subject of this suite. DISPLAY and LVGL come in by `select` from the
# application Kconfig, not from here - that is the property the modularity
# matrix protects.
CONFIG_REFLOW_UI_DISPLAY=y

# The panel this suite needs is one whose readiness it can deny, not one that
# draws: the dummy driver gives a real device on a simulated platform.
CONFIG_DUMMY_DISPLAY=y

CONFIG_REFLOW_SHELL=n
CONFIG_REFLOW_UI_INPUT=n
CONFIG_REFLOW_NET=n

# Sizing the application Kconfig ANNOUNCES but does not deliver, pinned here by
# hand (found while building this suite, and now RFO-B49 / #161).
#
# `configdefault LV_Z_MEM_POOL_SIZE default 24576 if REFLOW_UI_DISPLAY` sat in
# the block AFTER `source "Kconfig.zephyr"`, and upstream declares
# `default 2048` unconditionally (zephyr/modules/lvgl/Kconfig.memory:40), so the
# configdefault never applied and the image came out with 2048 - the same
# POSITION defect as RFO-B15 (#121) and RFO-G32 (#122). With 2048 this image does
# not get as far as printing the banner.
#
# Fixing that is not this ticket: it became #161 and is fixed in PR #163. This
# line stays so the suite builds a working image on its own, independently of
# the merge order; once #163 lands it is a redundant assignment of the value the
# Kconfig already supplies, and can go.
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_MAIN_STACK_SIZE=8192

# native_sim's counterpart of the line below, and the answer to the SIGABRT that
# held this suite up: enabling DISPLAY on native_sim also turns SDL_DISPLAY on,
# which puts zephyr/boards/native/common/sdl/ in the image - `sdl_init` at
# PRE_BOOT_2 and, the part that mattered, `NATIVE_TASK(sdl_cleanup, ON_EXIT, 2)`
# calling SDL_Quit(). That hook runs inside posix_exit(), which is AFTER ztest
# has printed PROJECT EXECUTION SUCCESSFUL - which is why every assertion passed
# and the process still died with rc=-6, without a line in between.
#
# Measured, not deduced, and the measurement is also the limit of what I can
# claim: built and ran this image on native_sim under WSL and it exits 0 there,
# because that machine has a working video stack. Forcing a headless one
# (SDL_VIDEODRIVER=dummy) makes the SDL display fail loudly instead -
# "Couldn't find matching render driver", rc=1 - which proves the SDL display
# is live in this image and tries to open a window, DUMMY_DISPLAY or not. The
# CI container is the environment that turns that into an abort, so CI is where
# this line is measured.
#
# Turning it off is not a workaround for the runner: the suite wants a device
# whose readiness it can DENY, not a framebuffer, and upstream's own LVGL ztest
# says the same thing on its line 4 (zephyr/tests/lib/gui/lvgl/prj.conf).
CONFIG_SDL_DISPLAY=n

# qemu_x86 has a `qemu,ramfb` node in its devicetree, and enabling DISPLAY turns
# its driver on by itself - which appends `-device ramfb -vga none -display sdl`
# to the QEMU command line. The Zephyr SDK QEMU on Windows has no SDL backend and
# refuses to start without printing a line: that is why the log came back empty
# and twister blew its timeout. This suite wants a device whose readiness it can
# deny, not a framebuffer.
CONFIG_QEMU_RAMFB_DISPLAY=n

# Diagnostics, and they earn their place in a suite nobody can run locally: the
# image passed every assertion and then exited with SIGABRT, printing nothing.
# A silent abort is unreadable from a CI log, and these two make it speak -
# ASSERT turns a kernel __ASSERT into a located message, and immediate logging
# means the last lines are not sitting in a buffer when the process dies.
CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y

# LVGL's own log, ON here and only here. The application Kconfig turns it off
# (configdefault LV_USE_LOG default n if REFLOW_UI_DISPLAY), which is right for
# firmware and wrong for the one image built to be diagnosed: LVGL answers a
# failed allocation with LV_ASSERT_MALLOC, and with the log off that assert is a
# silent abort - which is exactly the shape of what this suite is doing
# (PROJECT EXECUTION SUCCESSFUL, then SIGABRT, not one line in between).
CONFIG_LV_USE_LOG=y

# Host-sized stacks. On native_sim the test thread runs on a 64-bit host with
# ZTEST_STACK_SIZE defaulting to 1024 and this file pinning MAIN_STACK_SIZE to
# 2048 - values inherited from an ARM tuning. Simulated memory is free, and a
# stack overflow here would also surface as a silent abort after the assertions
# passed, so the cheap answer is to take it off the table.
CONFIG_ZTEST_STACK_SIZE=8192
