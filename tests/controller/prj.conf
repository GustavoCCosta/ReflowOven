CONFIG_ZTEST=y
CONFIG_ZBUS=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# The optional features are not in this image: the point of the suite is the
# control core on its own, and their Kconfig dependencies would pull in
# subsystems (display, networking) this test has no board for.
CONFIG_REFLOW_SHELL=n
CONFIG_REFLOW_UI_DISPLAY=n
CONFIG_REFLOW_UI_INPUT=n
CONFIG_REFLOW_NET=n
