#
# Board specific overrides for ESP32-DevKitC.
#
# Intentionally empty: everything the ESP32 needs for Wi-Fi is declared as
# 'configdefault ... if REFLOW_NET' at the bottom of Kconfig, including
# CONFIG_WIFI_ESP32 (a symbol that only exists on Espressif SoCs, so the
# default is harmless everywhere else). That way a build with
# CONFIG_REFLOW_NET=n pulls in nothing network related and emits no Kconfig
# warnings about unmet dependencies.
#
# Wi-Fi on ESP32 also needs the Espressif binary blobs:
#   west blobs fetch hal_espressif
#
# Put genuine board quirks here (pin straps, flash size, clock tweaks).
