# Raspberry Pi Pico 2 (RP2350A) bring-up fragment.
# This file is merged after prj.conf, so the =n lines below win over it.

# Bring-up scope: control core plus shell. No panel, no networking.
CONFIG_REFLOW_UI_DISPLAY=n
CONFIG_REFLOW_UI_INPUT=n
CONFIG_REFLOW_NET=n
CONFIG_REFLOW_SHELL=y

# Console, log and shell over the USB cable (CDC ACM).
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT brings up the USB device stack with a
# single CDC ACM instance, so the application needs no USB code at all.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
# The PID and product string of that helper are set as configdefaults in
# Kconfig instead of here: assigning them unconditionally would warn in the
# usb-webui build, where the helper is off and usb_net.c owns the USB stack.

# Deferred logging matters here: with the console on USB, an immediate-mode
# log call from the control thread would block it on a USB transfer.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# The Pico 2 has no debug adapter on board; the watchdog is available if you
# want it later (CONFIG_WDT_*), the node is already enabled by the board.
