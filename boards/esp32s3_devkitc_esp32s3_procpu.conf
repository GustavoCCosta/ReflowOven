#
# Board specific overrides for the ESP32-S3-WROOM-1 target (Sunton
# ESP32-8048S043). This file is merged after prj.conf, so the =n lines below
# win over it.

# Bring-up scope: control core plus shell over the UART0 console. The 4.3"
# panel on this board is an RGB parallel display, not the SPI panel display_ui.c
# drives, and networking on the S3 has never been exercised (RFO-F04).
CONFIG_REFLOW_UI_DISPLAY=n
CONFIG_REFLOW_UI_INPUT=n
CONFIG_REFLOW_NET=n
CONFIG_REFLOW_SHELL=y

# Nothing else belongs here. The Wi-Fi symbols the ESP32 family needs are
# 'configdefault ... if REFLOW_NET' at the bottom of Kconfig, so a build with
# CONFIG_REFLOW_NET=n pulls in nothing network related - and adding them here
# would make the feature un-removable, which is the property the whole
# architecture exists to keep.
#
# Espressif targets need the binary blobs once:
#   west blobs fetch hal_espressif
