#
# SIMULATION AND BUILD TEST ONLY — companion of boards/native_sim.overlay.
# Merged after prj.conf, like every other fragment in this directory.
#
# native_sim declares its SPI controller as "zephyr,spi-emul-controller", and
# that driver is gated twice: CONFIG_SPI_EMUL is 'default y' when the node
# exists, but it also 'depends on EMUL', which is a menuconfig defaulting to n.
# Without EMUL the controller device is never instantiated and the MAX6675
# instance in the overlay fails to LINK, not to compile:
#
#   undefined reference to `__device_dts_ord_48'   (48 = spi0)
#
# So the emulation subsystem has to be asked for explicitly. It exists only in
# this file: no real board fragment enables it.
CONFIG_EMUL=y
CONFIG_SPI_EMUL=y
