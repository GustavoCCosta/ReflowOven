# Base configuration. Board specific bits live in boards/<board>.conf.

CONFIG_LOG=y
CONFIG_REFLOW_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Inter-module message bus
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y

# Thermocouple front-end (MAX6675 over SPI)
# CONFIG_MAX6675 is deliberately NOT set here: the driver is 'default y' when
# the devicetree has a maxim,max6675 node. Forcing it would turn a devicetree
# problem (overlay not applied) into a confusing Kconfig abort instead of the
# clear "missing alias reflow-thermocouple" compile error.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SENSOR=y

# Optional features. Turning one off here (or with -DCONFIG_...=n) removes its
# source file, its zbus observer AND the subsystems it needs: the dependencies
# are declared by the feature's Kconfig symbol, not hardcoded in this file.
CONFIG_REFLOW_SHELL=y
CONFIG_REFLOW_UI_DISPLAY=y
CONFIG_REFLOW_UI_INPUT=y
CONFIG_REFLOW_NET=y

# Wi-Fi credentials: replace, or move to settings/NVS before shipping.
CONFIG_REFLOW_WIFI_SSID="changeme"
CONFIG_REFLOW_WIFI_PSK="changeme"
