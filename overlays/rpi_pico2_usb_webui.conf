#
# Pico 2 with the web UI over USB Ethernet. Applied together with
# overlays/rpi_pico2_usb_webui.overlay by the 'usb-webui' snippet:
#
#   west build -p always -b rpi_pico2/rp2350a/m33 reflow_oven -S usb-webui
#
# Extra conf files are merged after boards/<board>.conf, so these win over the
# shell-only bring-up defaults.

CONFIG_REFLOW_NET=y
CONFIG_REFLOW_LINK_USB_ECM=y

# usb_net.c owns the USB device stack now: it registers the Ethernet function
# and the shell's CDC ACM in one device context. The CDC ACM helper would build
# a second context on the same controller, and only one can be enabled.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Console and shell still land on the CDC ACM function from the board overlay.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Room for the TCP/IP stack, the packet pools and the USB buffers.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
