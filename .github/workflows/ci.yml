name: CI

# Gate objetivo do processo. O Q.A. pode reprovar um PR com CI verde,
# mas ninguem aprova ou faz merge com CI vermelho.
#
# Nenhum agente pode alterar este arquivo (PROCESSO.md, secao 9): quem esta
# sendo medido nao mexe na regua.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logica:
    # Compilacao nativa da logica pura em C99. Roda em segundos e pega a
    # maior parte dos defeitos de controle (foi assim que RFO-B04 e B05
    # foram reproduzidos no relatorio inicial de Q.A.).
    name: Logica pura + host_sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar host_sim com -Wall -Wextra -Werror
        # host_sim.c faz #include "pid.h", que mora em src/core. Sem -Isrc/core e
        # sem os dois fontes, este passo nunca compilou -- e como ele e quem mede
        # o item 3 da Definition of Done, o item nunca foi medido. RFO-G10.
        #
        # Arquivo ausente e FALHA, nao "pulando": um job que se pula em silencio
        # e indistinguivel de um job que passa, e foi assim que o defeito ficou
        # escondido desde o primeiro commit.
        run: |
          test -f tools/host_sim.c || { echo "::error::tools/host_sim.c ausente"; exit 1; }
          gcc -std=c99 -Wall -Wextra -Werror -O2 -o /tmp/host_sim \
              tools/host_sim.c src/core/pid.c src/core/profile.c -Isrc/core -lm

      - name: Executar host_sim (informativo — ver RFO-G12)
        # DECISAO EXPLICITA, no lugar do `|| true` que estava aqui antes: a
        # execucao roda e o log fica visivel, mas nao derruba o job.
        #
        # Motivo, e ele e mensuravel: o perfil "Bake / Dry 200C" (commit a089dad)
        # soma 200+400+3000+180 = 3780 s de duracao nominal, e host_sim.c:97
        # limita a corrida a `t < 3600.0`. O simulador nao consegue terminar esse
        # perfil e devolve 1, com "run did not complete" -- apesar de o controle
        # rastrear bem (erro rms 0,45 C). E limite da ferramenta, nao defeito do
        # firmware. Enquanto o RFO-G12 nao fechar, exigir exit 0 aqui deixaria o
        # job permanentemente vermelho por um motivo falso.
        #
        # Quando o G12 fechar, junte este passo ao de cima e deixe o exit code
        # derrubar o job.
        continue-on-error: true
        run: /tmp/host_sim -v

  ztest:
    name: ztest (native_sim)
    runs-on: ubuntu-latest
    # `ci:latest` sao 7,1 GiB comprimidos (~15-20 descomprimidos) e o runner tem
    # ~14 GB livres: o pull enchia o disco e morria em "Initialize containers",
    # tres tentativas, ~8 min, em TODO commit. Nao era a tag nem a idade da
    # imagem -- era tamanho. E nao da para consertar com um passo de limpeza de
    # disco, porque o container e baixado ANTES de qualquer passo rodar.
    #
    # `ci-base` sao 2,5 GiB e trazem o venv Python, ninja, ccache e dtc -- tudo
    # que o native_sim precisa, ja que ele compila com o gcc do host e nao usa
    # toolchain do SDK. RFO-G11.
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:latest
      options: --user root
    env:
      # ci-base nao tem /opt/toolchains: apontar CMAKE_PREFIX_PATH para la faria
      # o CMake procurar um SDK que nao existe.
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Inicializar workspace west
        run: |
          if [ -f app/west.yml ]; then
            west init -l app
          else
            west init --narrow ws
            mv app ws/app || true
          fi
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Twister
        run: |
          west twister -T app/tests -p native_sim --inline-logs -v

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: twister-out/
          retention-days: 14

  modularidade:
    # O requisito central do projeto e poder ligar e desligar recursos.
    # Quebrar a build com uma feature desligada e reprovacao automatica.
    #
    # Opcoes bool reais do Kconfig da aplicacao (as demais sao int/string e nao
    # entram na matriz): REFLOW_UI_DISPLAY, REFLOW_UI_INPUT, REFLOW_SHELL,
    # REFLOW_NET. REFLOW_LINK_WIFI e REFLOW_LINK_USB_ECM formam um `choice`
    # dentro de `if REFLOW_NET` — sao alternativas, nunca ligadas juntas.
    name: Matriz de modularidade (native_sim)
    runs-on: ubuntu-latest
    # Mesma troca do job ztest, mesmo motivo (RFO-G11).
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:latest
      options: --user root
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    strategy:
      fail-fast: false
      matrix:
        combo:
          - nome: nucleo-apenas
            flags: "-DCONFIG_REFLOW_NET=n -DCONFIG_REFLOW_UI_DISPLAY=n -DCONFIG_REFLOW_UI_INPUT=n -DCONFIG_REFLOW_SHELL=n"
          - nome: sem-shell
            flags: "-DCONFIG_REFLOW_NET=n -DCONFIG_REFLOW_UI_DISPLAY=n -DCONFIG_REFLOW_UI_INPUT=y -DCONFIG_REFLOW_SHELL=n"
          - nome: sem-ui-input
            flags: "-DCONFIG_REFLOW_NET=n -DCONFIG_REFLOW_UI_DISPLAY=n -DCONFIG_REFLOW_UI_INPUT=n -DCONFIG_REFLOW_SHELL=y"
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Inicializar workspace west
        run: |
          if [ -f app/west.yml ]; then west init -l app; else west init ws; fi
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Build ${{ matrix.combo.nome }} @ native_sim
        run: |
          west build -p always -b native_sim -d build/${{ matrix.combo.nome }} \
            app -- ${{ matrix.combo.flags }}

  modularidade-boards:
    # Combinacoes que exigem hardware real (display, encoder, radio, USB) so
    # compilam para board de verdade. O README diz que essas builds nunca
    # foram executadas — entao este job comeca INFORMATIVO (continue-on-error)
    # para nao travar todo merge no dia 1.
    #
    # Assim que ficar verde, remova o continue-on-error e adicione-o aos
    # required checks da protecao de branch. Ate la, o Gerente le o resultado
    # e abre issue para cada combinacao quebrada.
    name: Matriz de modularidade (boards)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Mesma troca de imagem (RFO-G11). Diferenca em relacao aos jobs de
    # native_sim: board de verdade PRECISA de toolchain cruzado, e a ci-base nao
    # traz SDK. Ele e instalado num passo abaixo, com apenas os dois toolchains
    # que estas combinacoes usam -- e nao os ~15 que faziam a `ci` nao caber.
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: pico2-completo-usb
            board: rpi_pico2/rp2350a/m33
            flags: "-DCONFIG_REFLOW_NET=y -DCONFIG_REFLOW_LINK_USB_ECM=y -DCONFIG_REFLOW_UI_DISPLAY=y -DCONFIG_REFLOW_UI_INPUT=y -DCONFIG_REFLOW_SHELL=y"
          - nome: pico2-sem-rede
            board: rpi_pico2/rp2350a/m33
            flags: "-DCONFIG_REFLOW_NET=n -DCONFIG_REFLOW_UI_DISPLAY=y -DCONFIG_REFLOW_UI_INPUT=y -DCONFIG_REFLOW_SHELL=y"
          - nome: esp32-wifi
            board: esp32_devkitc/esp32/procpu
            flags: "-DCONFIG_REFLOW_NET=y -DCONFIG_REFLOW_LINK_WIFI=y -DCONFIG_REFLOW_UI_DISPLAY=n -DCONFIG_REFLOW_UI_INPUT=n -DCONFIG_REFLOW_SHELL=y"
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Inicializar workspace west
        run: |
          if [ -f app/west.yml ]; then west init -l app; else west init ws; fi
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Instalar SDK (so os toolchains destas boards)
        run: |
          west sdk install -t arm-zephyr-eabi -t xtensa-espressif_esp32-zephyr-elf

      - name: Buscar blobs do HAL Espressif
        # O alvo esp32 com REFLOW_NET=y + LINK_WIFI=y nao linka sem os blobs de
        # Wi-Fi. So faz sentido para a combinacao esp32; nas outras e ruido.
        if: startsWith(matrix.nome, 'esp32')
        run: west blobs fetch hal_espressif

      - name: Build ${{ matrix.nome }} @ ${{ matrix.board }}
        run: |
          west build -p always -b ${{ matrix.board }} -d build/${{ matrix.nome }} \
            app -- ${{ matrix.flags }}

  processo:
    # Verifica que o PR respeita o contrato antes de gastar tempo de revisao.
    name: Contrato de PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR referencia exatamente uma issue
        env:
          CORPO: ${{ github.event.pull_request.body }}
        run: |
          N=$(printf '%s' "$CORPO" | grep -ioE '(closes|fixes|resolves) #[0-9]+' | wc -l)
          if [ "$N" -ne 1 ]; then
            echo "::error::PR deve fechar exatamente uma issue (encontrado: $N)."
            echo "Uma issue por PR — PROCESSO.md secao 5."
            exit 1
          fi
      - name: Nao altera o gate nem o contrato
        run: |
          ALVO=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$ALVO" | grep -qE '^(\.github/workflows/|\.flow/PROCESSO\.md)'; then
            echo "::error::Este PR altera o gate de CI ou o contrato de processo."
            echo "Isso exige a label precisa-humano e revisao do Gustavo."
            exit 1
          fi
